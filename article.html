<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article – Wisdom</title><link rel="stylesheet" href="assets/style.css"></head><body><nav><a class="logo" href="index.html">🦉 <span>WIS</span>DOM</a><ul><li><a href="index.html">Home</a></li><li><a href="index.html#cats">Categories</a></li><li><a href="index.html#articles">Articles</a></li><li><a href="index.html#about">About</a></li><li><a href="write.html">✍️ Write</a></li></ul></nav><main class="post" id="post"></main><footer>© 2026 Wisdom · Built with care</footer><script src="assets/articles.js"></script><script src="assets/app.js"></script><script>
const id=new URLSearchParams(location.search).get("id");const items=[...(window.WISDOM_ARTICLES||[]),...JSON.parse(localStorage.getItem("wisdom_custom_articles")||"[]")];const a=items.find(x=>x.id===id)||items[0];const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const post=document.getElementById("post");document.title=a.title+" – Wisdom";post.innerHTML=`<div class="crumbs"><a href="index.html">Home</a> › <a href="index.html#articles">Articles</a> › ${esc(a.category)}</div><span class="kicker">${esc(a.category)}</span> <span class="badge">Community</span><h1>${esc(a.title)}</h1><div class="byline"><span>By ${esc(a.author)}</span><span>${esc(a.date)}</span><span>3 min read</span></div><div class="cover" style="background:#e0f7f4">${a.icon||"📝"}</div><p class="lede">${esc(a.summary)}</p><article class="prose">${(a.body||"").split(/\\n\\n/).map(p=>`<p>${esc(p)}</p>`).join("")}</article><div class="chips">${(a.tags||[]).map(t=>`<span class="chip">#${esc(t)}</span>`).join("")}</div><div class="author"><b>${esc(a.author)}</b><span>Sharing stories and perspectives with Wisdom readers.</span></div><div class="note">This is a community article. It was published without editorial review, and the views expressed are the author’s own.</div><div class="share"><span>Share this article:</span><button id="copy">Copy link</button><a target="_blank" href="https://wa.me/?text=${encodeURIComponent(a.title+" "+location.href)}">WhatsApp</a><a target="_blank" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(a.title)}&url=${encodeURIComponent(location.href)}">X</a></div><a class="btn back" href="index.html#articles">← Back to all articles</a>`;
document.getElementById("copy").onclick=async()=>{await navigator.clipboard.writeText(location.href);document.getElementById("copy").textContent="Copied!"};
</script></body></html>
